broker_policy:
  strategic_adapter: ibkr_web_api
  phase: 7_plus
  mvp_enabled: false

modes:
  research_only:
    enabled: true
    orders_allowed: false
  paper_trading:
    enabled: false
    requires:
      - capability_level_6
      - broker_sandbox_connection
      - order_intent_log
      - risk_gate
      - user_approval_gate
  live_trading:
    enabled: false
    requires:
      - capability_level_7
      - legal_review
      - broker_compliance_approval
      - paper_trading_track_record
      - kill_switch
      - daily_loss_limit
      - position_limit
      - execution_audit_log

order_path_required:
  - ai_judgment
  - capability_gate
  - risk_gate
  - order_intent
  - user_approval_or_auto_policy
  - broker_adapter
  - execution_audit_log

blocked_direct_paths:
  - ai_judgment_to_broker_adapter
  - rulebook_to_broker_adapter
  - ui_button_to_broker_adapter_without_order_intent
