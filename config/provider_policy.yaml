provider_policy:
  default_price_provider: prices.massive_us_stocks
  fallback_price_provider: prices.fixture
  official_macro_provider: macro.fred
  official_filing_provider: filings.sec_edgar

usage_gates:
  public_dashboard:
    require_license_ok: true
    require_redistribution_ok: true
    block_if_terms_unknown: true
  internal_research:
    require_license_ok: true
    allow_terms_pending_for_fixture: true
  unit_tests:
    network_allowed: false
    allowed_sources: [prices.fixture]

license_status_values:
  - internal_test_only
  - license_required
  - api_key_and_terms_required
  - public_api_policy_required
  - terms_review_required
  - index_license_required_for_redistribution
  - approved
  - blocked

source_priority:
  price_ohlcv:
    - prices.massive_us_stocks
    - prices.fixture
  macro_context:
    - macro.fred
  filings:
    - filings.sec_edgar
  sector_universe_reference:
    - universe.ssga_sector_spdr
    - indices.sp_global_sectors

runtime_behavior:
  if_license_blocked: "return license_blocked state and hide derived claims"
  if_source_stale: "return stale warning and lower conviction gate"
  if_terms_unknown_for_public: "block public display"
