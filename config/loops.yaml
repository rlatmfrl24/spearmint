version: 3
name: ai_market_decision_os_loop_config

principle: >
  Codex should not be hand-held through every step. Reusable loop specifications
  define how an agent finds work, performs bounded implementation, verifies real
  outcomes, records memory, and stops in a named terminal state.

terminal_states:
  success:
    meaning: Goal met and verification passed.
    counts_as_done: true
  no_op:
    meaning: Trigger fired but no eligible work exists.
    counts_as_done: true
  blocked:
    meaning: External input, credential, license, legal decision, provider approval, or human decision is required.
    counts_as_done: false
  stalled:
    meaning: Loop made no material progress for max_no_progress_rounds.
    counts_as_done: false
  exhausted:
    meaning: Budget, iteration, or time ceiling reached before success.
    counts_as_done: false
  escalated:
    meaning: Loop intentionally returned control to a human reviewer.
    counts_as_done: false

verification_ladder:
  L1_deterministic:
    description: Assertions, exact schema checks, exit codes, golden outputs, SQL migration dry-runs.
    autonomous: true
  L2_rule_or_policy:
    description: Linters, type checks, policy scans, financial output guardrails, capability-gate checks.
    autonomous: true
  L3_delayed_field_truth:
    description: CI, staging deploy, replay run, calibration run, paper-trading result, provider sync result.
    autonomous: partially
  L4_model_judge:
    description: Separate critic model evaluates a rubric; never the same agent approving itself.
    autonomous: assisted
  L5_human_checkpoint:
    description: Product owner, legal reviewer, broker approval, or human investment-domain review.
    autonomous: false

budgets:
  default_max_iterations: 4
  default_max_no_progress_rounds: 2
  default_max_files_changed_without_human_review: 25
  default_loop_memory_retention_days: 180

loop_classes:
  source_implementation:
    allowed_default: true
    allowed_verification_levels: [L1_deterministic, L2_rule_or_policy, L3_delayed_field_truth]
    required_memory: true
  documentation_sync:
    allowed_default: true
    allowed_verification_levels: [L1_deterministic, L2_rule_or_policy, L4_model_judge]
    required_memory: true
  data_pipeline:
    allowed_default: true
    allowed_verification_levels: [L1_deterministic, L2_rule_or_policy, L3_delayed_field_truth]
    required_memory: true
  ai_judgment:
    allowed_default: false
    allowed_verification_levels: [L1_deterministic, L2_rule_or_policy, L3_delayed_field_truth, L4_model_judge, L5_human_checkpoint]
    required_memory: true
  execution_or_trading:
    allowed_default: false
    allowed_verification_levels: [L1_deterministic, L2_rule_or_policy, L3_delayed_field_truth, L5_human_checkpoint]
    required_memory: true
    requires_capability_gate: true
    requires_risk_gate: true
    requires_audit_log: true

required_loop_spec_fields:
  - id
  - name
  - trigger
  - goal
  - scope
  - inputs
  - steps
  - verification
  - stopping_rule
  - terminal_states
  - memory
  - safety_constraints
  - files_to_update
  - handoff_summary
