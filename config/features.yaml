features:
  layer1_market_flow: true
  layer2_capacity_context: true
  layer3_leadership_transition: true
  layer4_validation: true
  layer5_ai_scenarios: true
  layer6_stock_candidates: false
  layer7_personalized_advice: false
  layer8_order_intents: false
  layer8_auto_trading: false
  layer9_ops_audit: true

market_scope:
  primary_market: US_SP500_SECTOR_ETF
  benchmark: SPY

persistence:
  canonical_db: postgres
  edge_cache: d1_optional
  object_store: cloudflare_r2

cloudflare:
  workers_api: true
  pages_frontend: true
  hyperdrive_postgres: true
  r2_raw_archive: true
  queues: true
  cron_triggers: true
  d1_cache: false

execution:
  broker_connected: false
  strategic_broker_adapter: ibkr_web_api
  paper_trading: false
  live_trading: false
  require_user_approval: true
  kill_switch_default: manual_halt

regulatory:
  research_only_mvp: true
  us_personal_advice_enabled: false
  korea_personal_advice_enabled: false
  jurisdiction_gate_required: true

forecasting:
  expose_probabilities: false
  expose_expected_returns: false
  expose_target_prices: false
  require_calibration_gate: true
