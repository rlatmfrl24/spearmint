database:
  engine: postgres
  canonical: true
  local_dev: docker_postgres
  migrations: database/migrations
  schemas:
    - core
    - raw
    - derived
    - validation
    - ai
    - ops
    - execution

extensions_recommended:
  - pgcrypto
  - pg_stat_statements
  - timescaledb_optional

partitioning_policy:
  raw.series_daily: monthly_by_trade_date_when_large
  derived.sector_metrics_daily: yearly_by_as_of_when_large
  ops.run_log: monthly_by_started_at_when_large

read_path:
  workers_api: derived.dashboard_snapshot or materialized views
  heavy_compute: external batch worker or bounded internal job
  validation: validation schema plus R2 artifacts

pit_required_fields:
  - observed_at
  - published_at
  - effective_at
  - fetched_at
  - known_at
  - asof_at
